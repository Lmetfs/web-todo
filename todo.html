<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo 列表 · V2.0 完整版（数据驱动）</title>
  <style>
    :root {
      --primary: #4874CB;
      --text-main: #333;
      --text-sub: #888;
      --border: #e0e0e0;
      --bg-item: #f5f7fb;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      color: var(--text-main);
    }
    h1 { color: var(--primary); font-size: 24px; }
    .hint { color: var(--text-sub); font-size: 13px; margin-bottom: 16px; }

    .todo-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    #todo-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      font-size: 16px;
    }
    #add-btn {
      padding: 10px 20px;
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius);
      font-size: 16px;
      cursor: pointer;
    }
    #add-btn:hover { background: #3a5fa8; }

    /* 筛选栏 */
    .filter-row { display: flex; gap: 6px; margin-bottom: 16px; }
    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-sub);
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    #clear-btn {
      margin-left: auto;
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-sub);
    }
    #clear-btn:hover { color: #c0392b; border-color: #c0392b; }

    /* 列表 */
    #todo-list { list-style: none; padding: 0; margin: 0; }
    #todo-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-item);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
    }
    #todo-list li.done .todo-text {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .todo-text { flex: 1; font-size: 15px; }
    .del-btn {
      border: none;
      background: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 13px;
      padding: 4px 6px;
    }
    .del-btn:hover { color: #c0392b; }
    .empty-tip { text-align: center; color: var(--text-sub); font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>
  <h1>我的待办清单</h1>
  <p class="hint">V2.0 完整版 · 数据驱动（改数据 → 保存 → 重渲染）</p>

  <div class="todo-input-row">
    <input type="text" id="todo-input" placeholder="输入待办事项">
    <button id="add-btn">添加</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="active">未完成</button>
    <button class="filter-btn" data-filter="done">已完成</button>
    <!-- <button id="clear-btn">清除已完成</button> -->
  </div>

  <ul id="todo-list"></ul>

  <script>
    /* ============ 数据层：唯一数据源 ============ */
    let todos = [];
    let currentFilter = 'all';   // 'all' | 'active' | 'done'

    const input = document.querySelector('#todo-input');
    const addBtn = document.querySelector('#add-btn');
    const list = document.querySelector('#todo-list');
    
    const filterBtns = document.querySelectorAll('.filter-btn');

    /* ============ 持久化：保存与恢复 ============ */
    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function load() {
      const raw = localStorage.getItem('todos');
      // 边界检查：localStorage 可能为空或存了非法 JSON
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) todos = parsed;
      } catch (e) {
        console.warn('本地数据解析失败，已忽略', e);
      }
    }

    /* ============ 三个操作函数：改数据 → 保存 → 重渲染 ============ */
    // 1) 添加：用展开 [...todos, newItem] 生成新数组，不 push
    function addTodo(text) {
      const newTodo = {
        id: Date.now(),
        text: text,
        done: false
      };
      todos = [...todos, newTodo];
      save();
      render();
    }

    // 2) 删除：用 filter 生成新数组（天然排除目标项），不 splice
    function removeTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    // 3) 切换完成状态：用 map 生成新数组 + 展开覆盖命中的那项，不用 forEach 就地改
    function toggleTodo(id) {
      todos = todos.map(t =>
        t.id === id ? { ...t, done: !t.done } : t
      );
      save();
      render();
    }

    /* ============ 渲染层：只读数据，不改数据 ============ */
    function render() {
      // 第一步：根据 currentFilter 得到要显示的数组（filter 生成新数组）
      const visible = todos.filter(t => {
        if (currentFilter === 'active') return !t.done;
        if (currentFilter === 'done') return t.done;
        return true;
      });

      // 第二步：清空并重建 DOM
      list.innerHTML = '';

      if (visible.length === 0) {
        const tip = document.createElement('p');
        tip.className = 'empty-tip';
        tip.textContent = currentFilter === 'done' ? '还没有已完成的任务' : '暂无任务，添加一条吧';
        list.appendChild(tip);
        return;
      }

      // 第三步：逐项建元素并挂载
      visible.forEach(todo => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;   // 纯文本渲染，杜绝 XSS

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', () => removeTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    /* ============ 事件绑定 ============ */
    addBtn.addEventListener('click', () => {
      const text = input.value.trim();
      if (text === '') return;
      addTodo(text);
      input.value = '';
      input.focus();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addBtn.click();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    /* ============ 初始化：先恢复数据，再渲染 ============ */
    load();
    render();
  </script>
</body>
</html>
